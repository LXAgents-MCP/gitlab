[package]
name = "lxagents-gitlab"
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
description = "MCP server that gives an LLM access to GitLab — projects, branches, files, commits, tags, releases, issues, merge requests and CI/CD pipelines — through the GitLab REST API. Stdio, or HTTP behind an access token."
license = "MIT"
authors = ["LXAgents"]
repository = "https://github.com/LXAgents-MCP/gitlab"
homepage = "https://github.com/LXAgents-MCP/gitlab#readme"
keywords = ["mcp", "model-context-protocol", "gitlab", "lxagents"]
publish = false
autotests = false

[lib]
name = "lxagents_gitlab"
path = "src/lib.rs"

[[bin]]
name = "lxagents-gitlab"
path = "src/main.rs"

[[test]]
name = "suite"
path = "test/main.rs"

[dependencies]
rmcp = { version = "3.10", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "signal", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
subtle = "2.6"
base64 = "0.23"
percent-encoding = "2.3"
regex = "1.13"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
encoding_rs = "0.8"
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
rmcp = { version = "3.10", default-features = false, features = ["client", "server", "transport-io", "transport-child-process"] }

[profile.release]
strip = true
lto = "thin"
